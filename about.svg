                                                                                                                                                              
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%">                                                                                 
    <defs>                                                                                                                                                    
      <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">                                                                                            
        <stop offset="0%" stop-color="#0d1117"/>                                                                                                              
        <stop offset="100%" stop-color="#0f1923"/>                                                                                                            
      </linearGradient>                                                                                                                                       
      <linearGradient id="lineH" x1="0%" y1="0%" x2="100%" y2="0%">                                                                                           
        <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>                                                                                             
        <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.5"/>                                                                                          
        <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>                                                                                           
      </linearGradient>                                                                                                                                       
      <filter id="glow">                                                                                                                                      
        <feGaussianBlur stdDeviation="2.5" result="blur"/>                                                                                                    
        <feMerge>                                                                                                                                             
          <feMergeNode in="blur"/>                                                                                                                            
          <feMergeNode in="SourceGraphic"/>                                                                                                                   
        </feMerge>                                                                                                                                            
      </filter>                                                                                                                                               
    </defs>                                                                                                                                                   
                                                                                                                                                              
    <rect width="900" height="420" fill="url(#bg)"/>                                                                                                          
                                                                                                                                                              
    <!-- Barra superior -->                                                                                                                                   
    <rect x="0" y="0" width="900" height="46" fill="#0a0f16"/>                                                                                                
    <line x1="0" y1="46" x2="900" y2="46" stroke="url(#lineH)" stroke-width="1"/>                                                                             
    <circle cx="36" cy="23" r="6" fill="#ff5f57"/>                                                                                                            
    <circle cx="56" cy="23" r="6" fill="#ffbd2e"/>                                                                                                            
    <circle cx="76" cy="23" r="6" fill="#28c840"/>                                                                                                            
    <text x="450" y="29" font-family="'Courier New', monospace" font-size="13"                                                                                
          fill="#3d4f63" text-anchor="middle">~/.config/yoshi/profile.conf</text>                                                                             
                                                                                                                                                              
    <!-- Brackets esquinas -->                                                                                                                                
    <path d="M 30 58 L 30 96 M 30 58 L 68 58" stroke="#22d3ee" stroke-width="2" fill="none" opacity="0.7" filter="url(#glow)"/>                               
    <path d="M 870 58 L 870 96 M 870 58 L 832 58" stroke="#22d3ee" stroke-width="2" fill="none" opacity="0.7" filter="url(#glow)"/>                           
    <path d="M 30 400 L 30 362 M 30 400 L 68 400" stroke="#22d3ee" stroke-width="2" fill="none" opacity="0.7" filter="url(#glow)"/>                           
    <path d="M 870 400 L 870 362 M 870 400 L 832 400" stroke="#22d3ee" stroke-width="2" fill="none" opacity="0.7" filter="url(#glow)"/>                       
                                                                                                                                                              
    <!-- Comentario header -->                                                                                                                                
    <text y="76" font-family="'Courier New', monospace" font-size="13" opacity="0">                                                                           
      <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.4s" fill="freeze"/>                                                                
      <tspan x="60" fill="#3d4f63"># last updated: always</tspan>                                                                                             
    </text>                                                                                                                                                   
                                                                                                                                                              
    <!-- [identity] -->                                                                                                                                       
    <text y="112" font-family="'Courier New', monospace" font-size="13" font-weight="bold" opacity="0">                                                       
      <animate attributeName="opacity" from="0" to="1" begin="0.7s" dur="0.3s" fill="freeze"/>                                                                
      <tspan x="60" fill="#22d3ee" filter="url(#glow)">[identity]</tspan>                                                                                     
    </text>                                                                                                                                                   
                                                                                                                                                              
    <text y="134" font-family="'Courier New', monospace" font-size="13" opacity="0">                                                                          
      <animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.4s" fill="freeze"/>                                                                
      <tspan x="60" fill="#7c93b0">name         </tspan><tspan fill="#4b5563">= </tspan><tspan fill="#e2e8f0">Fernando Yeoshua Sanchez</tspan>                
    </text>                                                                                                                                                   
                                                                                                                                                              
    <text y="156" font-family="'Courier New', monospace" font-size="13" opacity="0">                                                                          
      <animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.4s" fill="freeze"/>                                                                
      <tspan x="60" fill="#7c93b0">alias        </tspan><tspan fill="#4b5563">= </tspan><tspan fill="#e2e8f0">YoshiBigSmoke</tspan>                           
    </text>                                                                                                                                                   
                                                                                                                                                              
    <text y="178" font-family="'Courier New', monospace" font-size="13" opacity="0">                                                                          
      <animate attributeName="opacity" from="0" to="1" begin="1.9s" dur="0.4s" fill="freeze"/>                                                                
      <tspan x="60" fill="#7c93b0">coding_since </tspan><tspan fill="#4b5563">= </tspan><tspan fill="#e2e8f0">age 15</tspan><tspan fill="#3d4f63">  # and     
  never looked back</tspan>                                                                                                                                   
    </text>                                                                                                                                                   
                                                                                                                                                              
    <!-- [environment] -->                                                                                                                                    
    <text y="214" font-family="'Courier New', monospace" font-size="13" font-weight="bold" opacity="0">                                                       
      <animate attributeName="opacity" from="0" to="1" begin="2.4s" dur="0.3s" fill="freeze"/>                                                                
      <tspan x="60" fill="#22d3ee" filter="url(#glow)">[environment]</tspan>                                                                                  
    </text>                                                                                                                                                   
                                                                                                                                                              
    <text y="236" font-family="'Courier New', monospace" font-size="13" opacity="0">                                                                          
      <animate attributeName="opacity" from="0" to="1" begin="2.8s" dur="0.4s" fill="freeze"/>                                                                
      <tspan x="60" fill="#7c93b0">os           </tspan><tspan fill="#4b5563">= </tspan><tspan fill="#e2e8f0">Arch Linux</tspan><tspan fill="#3d4f63">  #     
  btw</tspan>                                                                                                                                                 
    </text>                                                                                                                                                   
                                                                                                                                                              
    <text y="258" font-family="'Courier New', monospace" font-size="13" opacity="0">                                                                          
      <animate attributeName="opacity" from="0" to="1" begin="3.2s" dur="0.4s" fill="freeze"/>                                                                
      <tspan x="60" fill="#7c93b0">editor       </tspan><tspan fill="#4b5563">= </tspan><tspan fill="#e2e8f0">Neovim</tspan>                                  
    </text>                                                                                                                                                   
                                                                                                                                                              
    <text y="280" font-family="'Courier New', monospace" font-size="13" opacity="0">                                                                          
      <animate attributeName="opacity" from="0" to="1" begin="3.6s" dur="0.4s" fill="freeze"/>                                                                
      <tspan x="60" fill="#7c93b0">project      </tspan><tspan fill="#4b5563">= </tspan><tspan fill="#e2e8f0">netmappel</tspan><tspan fill="#3d4f63">  # wip, 
  always building</tspan>                                                                                                                                     
    </text>                                                                                                                                                   
                                                                                                                                                              
    <!-- [mindset] -->                                                                                                                                        
    <text y="316" font-family="'Courier New', monospace" font-size="13" font-weight="bold" opacity="0">                                                       
      <animate attributeName="opacity" from="0" to="1" begin="4.1s" dur="0.3s" fill="freeze"/>                                                                
      <tspan x="60" fill="#22d3ee" filter="url(#glow)">[mindset]</tspan>                                                                                      
    </text>                                                                                                                                                   
                                                                                                                                                              
    <text y="338" font-family="'Courier New', monospace" font-size="13" opacity="0">                                                                          
      <animate attributeName="opacity" from="0" to="1" begin="4.5s" dur="0.4s" fill="freeze"/>                                                                
      <tspan x="60" fill="#7c93b0">approach     </tspan><tspan fill="#4b5563">= </tspan><tspan fill="#e2e8f0">break it → understand it → build it             
  better</tspan>                                                                                                                                              
    </text>                                                                                                                                                   
                                                                                                                                                              
    <text y="360" font-family="'Courier New', monospace" font-size="13" opacity="0">                                                                          
      <animate attributeName="opacity" from="0" to="1" begin="4.9s" dur="0.4s" fill="freeze"/>                                                                
      <tspan x="60" fill="#7c93b0">notes        </tspan><tspan fill="#4b5563">= </tspan><tspan fill="#e2e8f0">Learning Note → github.com/YoshiBigSmoke</tspan>
    </text>                                                                                                                                                   
                                                                                                                                                              
    <text y="382" font-family="'Courier New', monospace" font-size="13" opacity="0">                                                                          
      <animate attributeName="opacity" from="0" to="1" begin="5.3s" dur="0.4s" fill="freeze"/>                                                                
      <tspan x="60" fill="#7c93b0">new_tech     </tspan><tspan fill="#4b5563">= </tspan><tspan fill="#e2e8f0">yes. always.</tspan><tspan fill="#3d4f63">  #   
  bring it on</tspan>                                                                                                                                         
    </text>                                                                                                                                                   
                                                                                                                                                              
    <!-- Cursor parpadeando -->                                                                                                                               
    <rect x="60" y="390" width="8" height="13" fill="#22d3ee" opacity="0" filter="url(#glow)">                                                                
      <animate attributeName="opacity" from="0" to="1" begin="5.7s" dur="0.1s" fill="freeze"/>                                                                
      <animate attributeName="opacity" values="1;0;1" dur="1s" begin="5.8s" repeatCount="indefinite"/>                                                        
    </rect>                                                                                                                                                   
                                                                                                                                                              
    <!-- Scan line -->                                                                                                                                        
    <rect x="0" y="0" width="900" height="2" fill="url(#lineH)" opacity="0">                                                                                  
      <animate attributeName="y" from="-2" to="422" dur="6s" begin="6.5s" repeatCount="indefinite"/>                                                          
      <animate attributeName="opacity" values="0;0.4;0.4;0" keyTimes="0;0.05;0.95;1" dur="6s" begin="6.5s" repeatCount="indefinite"/>                         
    </rect>                                                                                                                                                   
  </svg>  
