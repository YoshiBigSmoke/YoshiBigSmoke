<svg width="100%" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#03001C"/>
      <stop offset="50%"  stop-color="#0d0530"/>
      <stop offset="100%" stop-color="#050520"/>
    </linearGradient>
    <linearGradient id="holo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#4CC9F0" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#7209B7" stop-opacity="1"/>
      <stop offset="50%"  stop-color="#F72585" stop-opacity="1"/>
      <stop offset="75%"  stop-color="#4361EE" stop-opacity="1"/>
      <stop offset="100%" stop-color="#4CC9F0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scan-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#4CC9F0" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#4CC9F0" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#4CC9F0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="grid-fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#4CC9F0" stop-opacity="0"/>
      <stop offset="100%" stop-color="#4CC9F0" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="radar-fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#4CC9F0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4CC9F0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="globe-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#4CC9F0" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#4CC9F0" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes scan {
        0%   { transform: translateY(-42px); }
        100% { transform: translateY(292px); }
      }
      @keyframes radar {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
      @keyframes globe-pulse {
        0%,100% { opacity:0.28; }
        50%     { opacity:0.55; }
      }
      @keyframes ring-pulse {
        0%,100% { opacity:0.15; r:58; }
        50%     { opacity:0.4;  r:62; }
      }
      @keyframes glow-b  { 0%,100%{opacity:.5} 50%{opacity:1} }
      @keyframes glow-b2 { 0%,100%{opacity:.4} 50%{opacity:.9} }
      @keyframes glow-b3 { 0%,100%{opacity:.35} 50%{opacity:.8} }
      @keyframes sp-spin {
        0%  {opacity:.08;transform:scale(.5) rotate(0deg)}
        50% {opacity:1;  transform:scale(1.4) rotate(45deg)}
        100%{opacity:.08;transform:scale(.5) rotate(90deg)}
      }
      @keyframes corner-blink {
        0%,88%,92%,100%{opacity:1} 90%{opacity:.1}
      }
      @keyframes holo-pulse  { 0%,100%{opacity:.55} 50%{opacity:1} }
      @keyframes code-fade {
        0%,100%{opacity:0} 20%,80%{opacity:.35}
      }
      @keyframes code-fade2 {
        0%,100%{opacity:0} 30%,70%{opacity:.3}
      }
      @keyframes code-fade3 {
        0%,100%{opacity:0} 10%,90%{opacity:.25}
      }
      @keyframes dot-travel {
        0%  {stroke-dashoffset:120; opacity:0}
        10% {opacity:.8}
        90% {opacity:.8}
        100%{stroke-dashoffset:0;  opacity:0}
      }
      @keyframes dot-travel2 {
        0%  {stroke-dashoffset:80; opacity:0}
        15% {opacity:.7}
        85% {opacity:.7}
        100%{stroke-dashoffset:0; opacity:0}
      }
      @keyframes crosshair-spin {
        from{transform:rotate(0deg)} to{transform:rotate(90deg)}
      }
      @keyframes glitch-line {
        0%,91%,95%,100%{opacity:0;transform:translateX(0)}
        92%{opacity:.55;transform:translateX(-8px)}
        93%{opacity:.35;transform:translateX(6px)}
        94%{opacity:0}
      }
      @keyframes node-blink {
        0%,100%{opacity:.3} 50%{opacity:1}
      }

      .scan      { animation: scan         5s linear infinite; }
      .radar-arm { transform-origin: 450px 115px;
                   animation: radar 6s linear infinite; }
      .globe-fill{ animation: globe-pulse  3s ease-in-out infinite; }
      .globe-ring{ animation: globe-pulse  3s ease-in-out .8s infinite; }
      .bld-l     { animation: glow-b       3.2s ease-in-out infinite; }
      .bld-m     { animation: glow-b2      4.0s ease-in-out .6s infinite; }
      .bld-r     { animation: glow-b3      2.8s ease-in-out 1.2s infinite; }
      .sp-a      { animation: sp-spin      2.1s ease-in-out infinite; }
      .sp-b      { animation: sp-spin      2.7s ease-in-out .9s infinite; }
      .sp-c      { animation: sp-spin      1.9s ease-in-out 1.6s infinite; }
      .sp-d      { animation: sp-spin      3.3s ease-in-out .4s infinite; }
      .sp-e      { animation: sp-spin      2.5s ease-in-out 1.1s infinite; }
      .corner    { animation: corner-blink 8s linear infinite; }
      .holo-ln   { animation: holo-pulse   2.8s ease-in-out infinite; }
      .cf1       { animation: code-fade    5s ease-in-out infinite; }
      .cf2       { animation: code-fade2   7s ease-in-out 1s infinite; }
      .cf3       { animation: code-fade3   6s ease-in-out 2s infinite; }
      .cf4       { animation: code-fade    8s ease-in-out 3s infinite; }
      .cf5       { animation: code-fade2   5.5s ease-in-out .5s infinite; }
      .cf6       { animation: code-fade3   7.5s ease-in-out 2.5s infinite; }
      .dt1       { stroke-dasharray:8 112; animation: dot-travel  3s linear infinite; }
      .dt2       { stroke-dasharray:8 72;  animation: dot-travel2 4s linear 1s infinite; }
      .dt3       { stroke-dasharray:8 90;  animation: dot-travel  5s linear 2s infinite; }
      .nd        { animation: node-blink   2s ease-in-out infinite; }
      .nd2       { animation: node-blink   3s ease-in-out .7s infinite; }
      .nd3       { animation: node-blink   2.5s ease-in-out 1.4s infinite; }
      .glitch-fx { animation: glitch-line  7s steps(1) infinite; }
      .ch-spin   { transform-origin: 300px 85px;
                   animation: crosshair-spin 8s linear infinite; }
      .ch-spin2  { transform-origin: 600px 85px;
                   animation: crosshair-spin 10s linear infinite reverse; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="280" fill="url(#bg)"/>

  <!-- ── CIRCUIT TRACES (sky area) ───────────────────────────── -->
  <!-- Left circuit -->
  <g opacity="0.22" fill="none" stroke="#4361EE" stroke-width="0.7">
    <polyline points="220,60 250,60 250,85 320,85"/>
    <polyline points="220,100 280,100 280,115 340,115"/>
    <polyline points="240,75 240,60"/>
    <polyline points="310,85 310,105 340,105"/>
  </g>
  <!-- Left circuit nodes -->
  <g class="nd" fill="#4361EE" opacity="0.6">
    <circle cx="250" cy="60"  r="2.5"/>
    <circle cx="250" cy="85"  r="2"/>
    <circle cx="280" cy="100" r="2.5"/>
    <circle cx="310" cy="85"  r="2"/>
  </g>
  <!-- Right circuit -->
  <g opacity="0.22" fill="none" stroke="#4361EE" stroke-width="0.7">
    <polyline points="680,60 650,60 650,85 580,85"/>
    <polyline points="680,100 620,100 620,115 560,115"/>
    <polyline points="660,75 660,60"/>
    <polyline points="590,85 590,105 560,105"/>
  </g>
  <g class="nd2" fill="#4361EE" opacity="0.6">
    <circle cx="650" cy="60"  r="2.5"/>
    <circle cx="650" cy="85"  r="2"/>
    <circle cx="620" cy="100" r="2.5"/>
    <circle cx="590" cy="85"  r="2"/>
  </g>
  <!-- Top center circuit bridge -->
  <g opacity="0.18" fill="none" stroke="#7209B7" stroke-width="0.7">
    <polyline points="340,55 370,55 370,42 530,42 530,55 560,55"/>
    <polyline points="390,42 390,32 510,32 510,42"/>
    <circle cx="390" cy="32" r="2" fill="#7209B7" opacity="0.6"/>
    <circle cx="510" cy="32" r="2" fill="#7209B7" opacity="0.6"/>
    <circle cx="450" cy="32" r="3" fill="#F72585" opacity="0.5"/>
  </g>

  <!-- Animated data packets on traces -->
  <line class="dt1" x1="220" y1="85" x2="340" y2="85"
        stroke="#4CC9F0" stroke-width="3"/>
  <line class="dt2" x1="560" y1="85" x2="680" y2="85"
        stroke="#F72585" stroke-width="3"/>
  <line class="dt3" x1="370" y1="42" x2="530" y2="42"
        stroke="#7209B7" stroke-width="3"/>

  <!-- ── FLOATING CODE FRAGMENTS ─────────────────────────────── -->
  <text class="cf1" x="258" y="72" font-family="Courier New,monospace" font-size="8"
        fill="#4CC9F0">0x4F3A1B</text>
  <text class="cf2" x="580" y="72" font-family="Courier New,monospace" font-size="8"
        fill="#7209B7">ff:a3:22:01</text>
  <text class="cf3" x="272" y="130" font-family="Courier New,monospace" font-size="8"
        fill="#4CC9F0">SYN_ACK</text>
  <text class="cf4" x="598" y="128" font-family="Courier New,monospace" font-size="8"
        fill="#F72585">0xDEADBEEF</text>
  <text class="cf5" x="350" y="48" font-family="Courier New,monospace" font-size="7"
        fill="#F72585">EXPLOIT</text>
  <text class="cf6" x="520" y="48" font-family="Courier New,monospace" font-size="7"
        fill="#4CC9F0">ROP_CHAIN</text>

  <!-- ── CROSSHAIR TARGETS ───────────────────────────────────── -->
  <!-- Left crosshair -->
  <g class="ch-spin" fill="none" stroke="#4CC9F0" stroke-width="0.7" opacity="0.45">
    <circle cx="300" cy="85" r="14"/>
    <circle cx="300" cy="85" r="7"/>
    <line x1="286" y1="85" x2="278" y2="85"/>
    <line x1="314" y1="85" x2="322" y2="85"/>
    <line x1="300" y1="71" x2="300" y2="63"/>
    <line x1="300" y1="99" x2="300" y2="107"/>
  </g>
  <!-- Right crosshair -->
  <g class="ch-spin2" fill="none" stroke="#F72585" stroke-width="0.7" opacity="0.45">
    <circle cx="600" cy="85" r="14"/>
    <circle cx="600" cy="85" r="7"/>
    <line x1="586" y1="85" x2="578" y2="85"/>
    <line x1="614" y1="85" x2="622" y2="85"/>
    <line x1="600" y1="71" x2="600" y2="63"/>
    <line x1="600" y1="99" x2="600" y2="107"/>
  </g>

  <!-- ── CENTER GLOBE WIREFRAME ──────────────────────────────── -->
  <!-- Glow fill -->
  <circle class="globe-fill" cx="450" cy="115" r="58" fill="url(#globe-glow)"/>
  <!-- Outer ring pulse -->
  <circle class="globe-ring" cx="450" cy="115" r="64"
          fill="none" stroke="#4CC9F0" stroke-width="0.5" opacity="0.2"/>
  <!-- Globe circles -->
  <g fill="none" stroke="#4CC9F0" stroke-width="0.7" opacity="0.35">
    <!-- Outer circle -->
    <circle cx="450" cy="115" r="56"/>
    <!-- Latitude lines -->
    <ellipse cx="450" cy="115" rx="56" ry="20"/>
    <ellipse cx="450" cy="115" rx="56" ry="38"/>
    <ellipse cx="450" cy="115" rx="42" ry="12"/>
    <!-- Longitude lines -->
    <ellipse cx="450" cy="115" rx="28" ry="56"/>
    <ellipse cx="450" cy="115" rx="14" ry="56"/>
    <!-- Vertical axis -->
    <line x1="450" y1="59" x2="450" y2="171"/>
  </g>
  <!-- Radar sweep arm -->
  <line class="radar-arm" x1="450" y1="115" x2="506" y2="115"
        stroke="url(#radar-fade)" stroke-width="2" opacity="0.9"/>
  <!-- Globe center dot -->
  <circle class="nd3" cx="450" cy="115" r="3" fill="#4CC9F0" opacity="0.9"/>

  <!-- ── LEFT BUILDINGS ────────────────────────────────────────── -->
  <g class="bld-l" fill="none" stroke="#4CC9F0" stroke-width="0.8">
    <rect x="30"  y="50" width="36" height="172" fill="#03001C"/>
    <line x1="30"  y1="72"  x2="66"  y2="72"/>
    <line x1="30"  y1="95"  x2="66"  y2="95"/>
    <line x1="30"  y1="118" x2="66"  y2="118"/>
    <line x1="30"  y1="141" x2="66"  y2="141"/>
    <line x1="30"  y1="164" x2="66"  y2="164"/>
    <line x1="30"  y1="187" x2="66"  y2="187"/>
    <line x1="48"  y1="50"  x2="48"  y2="222"/>
    <line x1="48"  y1="50"  x2="48"  y2="32"/>
    <line x1="40"  y1="40"  x2="56"  y2="40"/>
    <rect x="38"  y="44" width="20" height="7" fill="#03001C"/>
  </g>
  <g class="bld-m" fill="none" stroke="#7209B7" stroke-width="0.7">
    <rect x="76"  y="95" width="26" height="127" fill="#03001C"/>
    <line x1="76"  y1="114" x2="102" y2="114"/>
    <line x1="76"  y1="134" x2="102" y2="134"/>
    <line x1="76"  y1="154" x2="102" y2="154"/>
    <line x1="76"  y1="174" x2="102" y2="174"/>
    <line x1="76"  y1="194" x2="102" y2="194"/>
    <line x1="89"  y1="95"  x2="89"  y2="222"/>
  </g>
  <g class="bld-l" fill="none" stroke="#4CC9F0" stroke-width="0.8">
    <rect x="112" y="72" width="48" height="150" fill="#03001C"/>
    <line x1="112" y1="92"  x2="160" y2="92"/>
    <line x1="112" y1="113" x2="160" y2="113"/>
    <line x1="112" y1="134" x2="160" y2="134"/>
    <line x1="112" y1="155" x2="160" y2="155"/>
    <line x1="112" y1="176" x2="160" y2="176"/>
    <line x1="112" y1="197" x2="160" y2="197"/>
    <line x1="136" y1="72"  x2="136" y2="222"/>
    <rect x="124" y="64" width="24" height="9" fill="#03001C" stroke="#4CC9F0" stroke-width="0.8"/>
    <line x1="136" y1="64"  x2="136" y2="50"/>
  </g>
  <g class="bld-m" fill="none" stroke="#4361EE" stroke-width="0.7">
    <rect x="170" y="118" width="20" height="104" fill="#03001C"/>
    <line x1="170" y1="136" x2="190" y2="136"/>
    <line x1="170" y1="155" x2="190" y2="155"/>
    <line x1="170" y1="174" x2="190" y2="174"/>
    <line x1="170" y1="193" x2="190" y2="193"/>
    <line x1="180" y1="118" x2="180" y2="222"/>
  </g>
  <g class="bld-r" fill="none" stroke="#F72585" stroke-width="0.6">
    <rect x="200" y="145" width="14" height="77" fill="#03001C"/>
    <line x1="200" y1="160" x2="214" y2="160"/>
    <line x1="200" y1="178" x2="214" y2="178"/>
    <line x1="200" y1="196" x2="214" y2="196"/>
    <line x1="207" y1="145" x2="207" y2="222"/>
  </g>

  <!-- ── RIGHT BUILDINGS ───────────────────────────────────────── -->
  <g class="bld-r" fill="none" stroke="#F72585" stroke-width="0.6">
    <rect x="686" y="145" width="14" height="77" fill="#03001C"/>
    <line x1="686" y1="160" x2="700" y2="160"/>
    <line x1="686" y1="178" x2="700" y2="178"/>
    <line x1="686" y1="196" x2="700" y2="196"/>
    <line x1="693" y1="145" x2="693" y2="222"/>
  </g>
  <g class="bld-m" fill="none" stroke="#4361EE" stroke-width="0.7">
    <rect x="710" y="118" width="20" height="104" fill="#03001C"/>
    <line x1="710" y1="136" x2="730" y2="136"/>
    <line x1="710" y1="155" x2="730" y2="155"/>
    <line x1="710" y1="174" x2="730" y2="174"/>
    <line x1="710" y1="193" x2="730" y2="193"/>
    <line x1="720" y1="118" x2="720" y2="222"/>
  </g>
  <g class="bld-l" fill="none" stroke="#4CC9F0" stroke-width="0.8">
    <rect x="740" y="72" width="48" height="150" fill="#03001C"/>
    <line x1="740" y1="92"  x2="788" y2="92"/>
    <line x1="740" y1="113" x2="788" y2="113"/>
    <line x1="740" y1="134" x2="788" y2="134"/>
    <line x1="740" y1="155" x2="788" y2="155"/>
    <line x1="740" y1="176" x2="788" y2="176"/>
    <line x1="740" y1="197" x2="788" y2="197"/>
    <line x1="764" y1="72"  x2="764" y2="222"/>
    <rect x="752" y="64" width="24" height="9" fill="#03001C" stroke="#4CC9F0" stroke-width="0.8"/>
    <line x1="764" y1="64"  x2="764" y2="50"/>
  </g>
  <g class="bld-m" fill="none" stroke="#7209B7" stroke-width="0.7">
    <rect x="798" y="95" width="26" height="127" fill="#03001C"/>
    <line x1="798" y1="114" x2="824" y2="114"/>
    <line x1="798" y1="134" x2="824" y2="134"/>
    <line x1="798" y1="154" x2="824" y2="154"/>
    <line x1="798" y1="174" x2="824" y2="174"/>
    <line x1="798" y1="194" x2="824" y2="194"/>
    <line x1="811" y1="95"  x2="811" y2="222"/>
  </g>
  <g class="bld-l" fill="none" stroke="#4CC9F0" stroke-width="0.8">
    <rect x="834" y="50" width="36" height="172" fill="#03001C"/>
    <line x1="834" y1="72"  x2="870" y2="72"/>
    <line x1="834" y1="95"  x2="870" y2="95"/>
    <line x1="834" y1="118" x2="870" y2="118"/>
    <line x1="834" y1="141" x2="870" y2="141"/>
    <line x1="834" y1="164" x2="870" y2="164"/>
    <line x1="834" y1="187" x2="870" y2="187"/>
    <line x1="852" y1="50"  x2="852" y2="222"/>
    <line x1="852" y1="50"  x2="852" y2="32"/>
    <line x1="844" y1="40"  x2="860" y2="40"/>
    <rect x="842" y="44" width="20" height="7" fill="#03001C"/>
  </g>

  <!-- ── FLOOR GRID ─────────────────────────────────────────────── -->
  <rect x="0" y="222" width="900" height="58" fill="url(#grid-fade)"/>
  <g stroke="url(#grid-fade)" stroke-width="0.85" fill="none">
    <line x1="0" y1="238" x2="900" y2="238"/>
    <line x1="0" y1="252" x2="900" y2="252"/>
    <line x1="0" y1="266" x2="900" y2="266"/>
    <line x1="450" y1="222" x2="0"   y2="280"/>
    <line x1="450" y1="222" x2="100" y2="280"/>
    <line x1="450" y1="222" x2="200" y2="280"/>
    <line x1="450" y1="222" x2="300" y2="280"/>
    <line x1="450" y1="222" x2="400" y2="280"/>
    <line x1="450" y1="222" x2="450" y2="280"/>
    <line x1="450" y1="222" x2="500" y2="280"/>
    <line x1="450" y1="222" x2="600" y2="280"/>
    <line x1="450" y1="222" x2="700" y2="280"/>
    <line x1="450" y1="222" x2="800" y2="280"/>
    <line x1="450" y1="222" x2="900" y2="280"/>
  </g>

  <!-- Holographic horizon -->
  <rect class="holo-ln" x="0" y="220" width="900" height="3" fill="url(#holo)"/>

  <!-- Glitch line -->
  <rect class="glitch-fx" x="0" y="130" width="900" height="3"
        fill="#4CC9F0" opacity="0.5"/>

  <!-- CRT scan line -->
  <rect class="scan" x="0" y="-42" width="900" height="42" fill="url(#scan-grad)"/>

  <!-- ── CORNER BRACKETS ───────────────────────────────────────── -->
  <g class="corner" fill="none" stroke="#4CC9F0" stroke-width="2.5">
    <polyline points="0,26 0,5 26,5"/>
    <polyline points="874,5 895,5 895,26"/>
  </g>
  <g class="corner" fill="none" stroke="#F72585" stroke-width="2.5">
    <polyline points="0,254 0,275 26,275"/>
    <polyline points="874,275 895,275 895,254"/>
  </g>

  <!-- ── SPARKLES ───────────────────────────────────────────────── -->
  <g class="sp-a" transform="translate(235,150)">
    <polygon points="0,-8 4,0 0,8 -4,0" fill="#4CC9F0"/>
    <polygon points="0,-4 2,0 0,4 -2,0" fill="#fff" opacity="0.8"/>
  </g>
  <g class="sp-b" transform="translate(665,148)">
    <polygon points="0,-8 4,0 0,8 -4,0" fill="#F72585"/>
    <polygon points="0,-4 2,0 0,4 -2,0" fill="#fff" opacity="0.8"/>
  </g>
  <g class="sp-c" transform="translate(450,175)">
    <polygon points="0,-7 3.5,0 0,7 -3.5,0" fill="#7209B7" opacity="0.9"/>
  </g>
  <g class="sp-d" transform="translate(370,195)">
    <polygon points="0,-5 2.5,0 0,5 -2.5,0" fill="#4361EE" opacity="0.7"/>
  </g>
  <g class="sp-e" transform="translate(530,193)">
    <polygon points="0,-5 2.5,0 0,5 -2.5,0" fill="#4CC9F0" opacity="0.7"/>
  </g>

  <!-- Micro labels -->
  <text x="10" y="18" font-family="Courier New,monospace" font-size="8"
        fill="#4CC9F0" opacity="0.4">// offensive.security</text>
  <text x="890" y="270" text-anchor="end" font-family="Courier New,monospace" font-size="8"
        fill="#F72585" opacity="0.4">// forever.online</text>
</svg>
