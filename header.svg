<svg width="100%" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#03001C"/>
      <stop offset="50%"  stop-color="#0d0530"/>
      <stop offset="100%" stop-color="#050520"/>
    </linearGradient>
    <linearGradient id="holo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#4CC9F0" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#7209B7" stop-opacity="1"/>
      <stop offset="50%"  stop-color="#F72585" stop-opacity="1"/>
      <stop offset="75%"  stop-color="#4361EE" stop-opacity="1"/>
      <stop offset="100%" stop-color="#4CC9F0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scan-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#4CC9F0" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#4CC9F0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4CC9F0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="build-fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#4CC9F0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#4CC9F0" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="grid-fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#4CC9F0" stop-opacity="0"/>
      <stop offset="100%" stop-color="#4CC9F0" stop-opacity="0.25"/>
    </linearGradient>
    <style>
      @keyframes scan {
        0%   { transform: translateY(0px);   opacity: 1; }
        100% { transform: translateY(230px); opacity: 1; }
      }
      @keyframes glow-build {
        0%,100% { opacity: 0.55; }
        50%     { opacity: 1; }
      }
      @keyframes sp-spin {
        0%   { opacity:0.1; transform:scale(0.6) rotate(0deg); }
        50%  { opacity:1;   transform:scale(1.4) rotate(45deg); }
        100% { opacity:0.1; transform:scale(0.6) rotate(90deg); }
      }
      @keyframes corner-flicker {
        0%,89%,91%,100% { opacity:1; }
        90%             { opacity:0.15; }
      }
      @keyframes holo-fade {
        0%,100% { opacity:0.6; }
        50%     { opacity:1; }
      }
      .scan    { animation: scan         4s linear infinite; }
      .bld     { animation: glow-build   3s ease-in-out infinite; }
      .bld2    { animation: glow-build   3.8s ease-in-out 0.5s infinite; }
      .bld3    { animation: glow-build   2.6s ease-in-out 1.2s infinite; }
      .sp-a    { animation: sp-spin      2.2s ease-in-out infinite; }
      .sp-b    { animation: sp-spin      2.9s ease-in-out 0.8s infinite; }
      .sp-c    { animation: sp-spin      1.8s ease-in-out 1.5s infinite; }
      .corner  { animation: corner-flicker 7s linear infinite; }
      .holo-ln { animation: holo-fade    2.5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- BG -->
  <rect width="900" height="220" fill="url(#bg)"/>

  <!-- === PIXEL CITY BUILDINGS (left side) === -->
  <!-- Building L1 - tall -->
  <g class="bld" stroke="#4CC9F0" stroke-width="0.8" fill="none">
    <rect x="42" y="60" width="32" height="108" fill="#03001C" stroke="#4CC9F0" stroke-width="0.7"/>
    <line x1="42" y1="80"  x2="74" y2="80"/>
    <line x1="42" y1="100" x2="74" y2="100"/>
    <line x1="42" y1="120" x2="74" y2="120"/>
    <line x1="42" y1="140" x2="74" y2="140"/>
    <line x1="42" y1="160" x2="74" y2="160"/>
    <line x1="58" y1="60"  x2="58" y2="168"/>
    <!-- antenna -->
    <line x1="58" y1="60" x2="58" y2="45"/>
    <line x1="52" y1="50" x2="64" y2="50"/>
  </g>
  <!-- Building L2 -->
  <g class="bld2" stroke="#7209B7" stroke-width="0.7" fill="none">
    <rect x="84" y="95" width="22" height="73" fill="#03001C"/>
    <line x1="84" y1="112" x2="106" y2="112"/>
    <line x1="84" y1="130" x2="106" y2="130"/>
    <line x1="84" y1="148" x2="106" y2="148"/>
    <line x1="95" y1="95"  x2="95"  y2="168"/>
  </g>
  <!-- Building L3 - wide -->
  <g class="bld" stroke="#4CC9F0" stroke-width="0.8" fill="none">
    <rect x="114" y="75" width="45" height="93" fill="#03001C"/>
    <line x1="114" y1="92"  x2="159" y2="92"/>
    <line x1="114" y1="110" x2="159" y2="110"/>
    <line x1="114" y1="128" x2="159" y2="128"/>
    <line x1="114" y1="146" x2="159" y2="146"/>
    <line x1="136" y1="75"  x2="136" y2="168"/>
    <!-- roof detail -->
    <rect x="124" y="68" width="24" height="8" fill="#03001C"/>
  </g>
  <!-- Building L4 small -->
  <g class="bld3" stroke="#4361EE" stroke-width="0.7" fill="none">
    <rect x="168" y="110" width="18" height="58" fill="#03001C"/>
    <line x1="168" y1="125" x2="186" y2="125"/>
    <line x1="168" y1="142" x2="186" y2="142"/>
    <line x1="177" y1="110" x2="177" y2="168"/>
  </g>

  <!-- === CENTER GAP (vanishing point area) === -->

  <!-- === PIXEL CITY BUILDINGS (right side, mirrored) === -->
  <!-- Building R4 small -->
  <g class="bld3" stroke="#4361EE" stroke-width="0.7" fill="none">
    <rect x="714" y="110" width="18" height="58" fill="#03001C"/>
    <line x1="714" y1="125" x2="732" y2="125"/>
    <line x1="714" y1="142" x2="732" y2="142"/>
    <line x1="723" y1="110" x2="723" y2="168"/>
  </g>
  <!-- Building R3 wide -->
  <g class="bld" stroke="#4CC9F0" stroke-width="0.8" fill="none">
    <rect x="741" y="75" width="45" height="93" fill="#03001C"/>
    <line x1="741" y1="92"  x2="786" y2="92"/>
    <line x1="741" y1="110" x2="786" y2="110"/>
    <line x1="741" y1="128" x2="786" y2="128"/>
    <line x1="741" y1="146" x2="786" y2="146"/>
    <line x1="763" y1="75"  x2="763" y2="168"/>
    <rect x="752" y="68" width="24" height="8" fill="#03001C"/>
  </g>
  <!-- Building R2 -->
  <g class="bld2" stroke="#7209B7" stroke-width="0.7" fill="none">
    <rect x="794" y="95" width="22" height="73" fill="#03001C"/>
    <line x1="794" y1="112" x2="816" y2="112"/>
    <line x1="794" y1="130" x2="816" y2="130"/>
    <line x1="794" y1="148" x2="816" y2="148"/>
    <line x1="805" y1="95"  x2="805" y2="168"/>
  </g>
  <!-- Building R1 tall -->
  <g class="bld" stroke="#4CC9F0" stroke-width="0.8" fill="none">
    <rect x="826" y="60" width="32" height="108" fill="#03001C"/>
    <line x1="826" y1="80"  x2="858" y2="80"/>
    <line x1="826" y1="100" x2="858" y2="100"/>
    <line x1="826" y1="120" x2="858" y2="120"/>
    <line x1="826" y1="140" x2="858" y2="140"/>
    <line x1="826" y1="160" x2="858" y2="160"/>
    <line x1="842" y1="60"  x2="842" y2="168"/>
    <line x1="842" y1="60" x2="842" y2="45"/>
    <line x1="836" y1="50" x2="848" y2="50"/>
  </g>

  <!-- Perspective floor grid -->
  <rect x="0" y="168" width="900" height="52" fill="url(#grid-fade)"/>
  <g stroke="url(#grid-fade)" stroke-width="0.9" fill="none">
    <line x1="0"   y1="185" x2="900" y2="185"/>
    <line x1="0"   y1="200" x2="900" y2="200"/>
    <line x1="0"   y1="215" x2="900" y2="215"/>
    <line x1="450" y1="168" x2="0"   y2="220"/>
    <line x1="450" y1="168" x2="112" y2="220"/>
    <line x1="450" y1="168" x2="225" y2="220"/>
    <line x1="450" y1="168" x2="337" y2="220"/>
    <line x1="450" y1="168" x2="450" y2="220"/>
    <line x1="450" y1="168" x2="563" y2="220"/>
    <line x1="450" y1="168" x2="675" y2="220"/>
    <line x1="450" y1="168" x2="788" y2="220"/>
    <line x1="450" y1="168" x2="900" y2="220"/>
  </g>

  <!-- Holographic horizon line -->
  <rect class="holo-ln" x="0" y="167" width="900" height="2.5" fill="url(#holo)"/>

  <!-- CRT scan line (sweeps top to bottom) -->
  <rect class="scan" x="0" y="-30" width="900" height="30" fill="url(#scan-grad)"/>

  <!-- Corner brackets -->
  <g class="corner" fill="none" stroke="#4CC9F0" stroke-width="2.5">
    <polyline points="0,24 0,4 24,4"/>
    <polyline points="876,4 896,4 896,24"/>
  </g>
  <g class="corner" fill="none" stroke="#F72585" stroke-width="2.5">
    <polyline points="0,196 0,216 24,216"/>
    <polyline points="876,216 896,216 896,196"/>
  </g>

  <!-- Sparkles -->
  <g class="sp-a" transform="translate(230,90)">
    <polygon points="0,-8 4,0 0,8 -4,0" fill="#4CC9F0"/>
    <polygon points="0,-4 2,0 0,4 -2,0" fill="#fff" opacity="0.8"/>
  </g>
  <g class="sp-b" transform="translate(670,85)">
    <polygon points="0,-8 4,0 0,8 -4,0" fill="#F72585"/>
    <polygon points="0,-4 2,0 0,4 -2,0" fill="#fff" opacity="0.8"/>
  </g>
  <g class="sp-c" transform="translate(450,52)">
    <polygon points="0,-10 5,0 0,10 -5,0" fill="#7209B7" opacity="0.9"/>
    <polygon points="0,-5 2.5,0 0,5 -2.5,0" fill="#fff" opacity="0.6"/>
  </g>
  <g class="sp-a" transform="translate(340,130)">
    <polygon points="0,-5 2.5,0 0,5 -2.5,0" fill="#4361EE" opacity="0.7"/>
  </g>
  <g class="sp-b" transform="translate(560,128)">
    <polygon points="0,-5 2.5,0 0,5 -2.5,0" fill="#4CC9F0" opacity="0.7"/>
  </g>

  <!-- Micro labels -->
  <text x="10" y="16" font-family="Courier New,monospace" font-size="8"
        fill="#4CC9F0" opacity="0.45">// offensive.security</text>
  <text x="890" y="212" text-anchor="end" font-family="Courier New,monospace" font-size="8"
        fill="#F72585" opacity="0.45">// forever.online</text>
</svg>
