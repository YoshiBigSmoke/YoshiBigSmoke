<svg width="100%" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#03001C"/>
      <stop offset="50%"  stop-color="#0d0530"/>
      <stop offset="100%" stop-color="#050520"/>
    </linearGradient>
    <linearGradient id="holo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#4CC9F0" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#7209B7" stop-opacity="1"/>
      <stop offset="50%"  stop-color="#F72585" stop-opacity="1"/>
      <stop offset="75%"  stop-color="#4361EE" stop-opacity="1"/>
      <stop offset="100%" stop-color="#4CC9F0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scan-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#4CC9F0" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#4CC9F0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4CC9F0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="grid-fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#4CC9F0" stop-opacity="0"/>
      <stop offset="100%" stop-color="#4CC9F0" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="glow-center" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7209B7" stop-opacity="0"/>
      <stop offset="35%"  stop-color="#4361EE" stop-opacity="0.18"/>
      <stop offset="50%"  stop-color="#4CC9F0" stop-opacity="0.28"/>
      <stop offset="65%"  stop-color="#4361EE" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7209B7" stop-opacity="0"/>
    </linearGradient>
    <style>
      @keyframes scan {
        0%   { transform: translateY(-40px); }
        100% { transform: translateY(290px); }
      }
      @keyframes glow-b {
        0%,100% { opacity:0.5; }
        50%     { opacity:1; }
      }
      @keyframes glow-b2 {
        0%,100% { opacity:0.45; }
        50%     { opacity:0.9; }
      }
      @keyframes glow-b3 {
        0%,100% { opacity:0.4; }
        50%     { opacity:0.85; }
      }
      @keyframes sp-spin {
        0%   { opacity:0.08; transform:scale(0.5) rotate(0deg); }
        50%  { opacity:1;    transform:scale(1.4) rotate(45deg); }
        100% { opacity:0.08; transform:scale(0.5) rotate(90deg); }
      }
      @keyframes corner-blink {
        0%,88%,92%,100% { opacity:1; }
        90%             { opacity:0.1; }
      }
      @keyframes holo-pulse {
        0%,100% { opacity:0.55; }
        50%     { opacity:1; }
      }
      @keyframes center-breathe {
        0%,100% { opacity:0.6; }
        50%     { opacity:1; }
      }
      @keyframes glitch-line {
        0%,92%,96%,100% { transform:translateX(0) scaleY(1); opacity:0; }
        93% { transform:translateX(-8px) scaleY(1.5); opacity:0.6; }
        94% { transform:translateX(6px) scaleY(0.8); opacity:0.4; }
        95% { transform:translateX(0) scaleY(1); opacity:0; }
      }
      .scan       { animation: scan          5s linear infinite; }
      .bld-l      { animation: glow-b        3.2s ease-in-out infinite; }
      .bld-m      { animation: glow-b2       4.0s ease-in-out 0.6s infinite; }
      .bld-r      { animation: glow-b3       2.8s ease-in-out 1.2s infinite; }
      .sp-a       { animation: sp-spin       2.1s ease-in-out infinite; }
      .sp-b       { animation: sp-spin       2.7s ease-in-out 0.9s infinite; }
      .sp-c       { animation: sp-spin       1.9s ease-in-out 1.6s infinite; }
      .sp-d       { animation: sp-spin       3.3s ease-in-out 0.4s infinite; }
      .sp-e       { animation: sp-spin       2.5s ease-in-out 1.1s infinite; }
      .corner     { animation: corner-blink  8s linear infinite; }
      .holo-ln    { animation: holo-pulse    2.8s ease-in-out infinite; }
      .center-glo { animation: center-breathe 4s ease-in-out infinite; }
      .glitch-fx  { animation: glitch-line   7s steps(1) infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="280" fill="url(#bg)"/>

  <!-- Center ambient glow -->
  <rect class="center-glo" x="250" y="60" width="400" height="140" fill="url(#glow-center)" rx="60"/>

  <!-- ── LEFT BUILDINGS ───────────────────────────────────────── -->
  <!-- L1 — tall tower -->
  <g class="bld-l" fill="none" stroke="#4CC9F0" stroke-width="0.8">
    <rect x="30" y="50" width="36" height="172" fill="#03001C"/>
    <line x1="30" y1="72"  x2="66" y2="72"/>
    <line x1="30" y1="95"  x2="66" y2="95"/>
    <line x1="30" y1="118" x2="66" y2="118"/>
    <line x1="30" y1="141" x2="66" y2="141"/>
    <line x1="30" y1="164" x2="66" y2="164"/>
    <line x1="30" y1="187" x2="66" y2="187"/>
    <line x1="48" y1="50"  x2="48" y2="222"/>
    <line x1="48" y1="50"  x2="48" y2="32"/>
    <line x1="40" y1="40"  x2="56" y2="40"/>
    <rect x="38" y="44" width="20" height="7" fill="#03001C"/>
  </g>
  <!-- L2 — medium -->
  <g class="bld-m" fill="none" stroke="#7209B7" stroke-width="0.7">
    <rect x="76" y="95" width="26" height="127" fill="#03001C"/>
    <line x1="76" y1="114" x2="102" y2="114"/>
    <line x1="76" y1="134" x2="102" y2="134"/>
    <line x1="76" y1="154" x2="102" y2="154"/>
    <line x1="76" y1="174" x2="102" y2="174"/>
    <line x1="76" y1="194" x2="102" y2="194"/>
    <line x1="89" y1="95"  x2="89"  y2="222"/>
  </g>
  <!-- L3 — wide -->
  <g class="bld-l" fill="none" stroke="#4CC9F0" stroke-width="0.8">
    <rect x="112" y="72" width="48" height="150" fill="#03001C"/>
    <line x1="112" y1="92"  x2="160" y2="92"/>
    <line x1="112" y1="113" x2="160" y2="113"/>
    <line x1="112" y1="134" x2="160" y2="134"/>
    <line x1="112" y1="155" x2="160" y2="155"/>
    <line x1="112" y1="176" x2="160" y2="176"/>
    <line x1="112" y1="197" x2="160" y2="197"/>
    <line x1="136" y1="72"  x2="136" y2="222"/>
    <rect x="124" y="64" width="24" height="9" fill="#03001C" stroke="#4CC9F0" stroke-width="0.8"/>
    <line x1="136" y1="64" x2="136" y2="50"/>
  </g>
  <!-- L4 — small -->
  <g class="bld-m" fill="none" stroke="#4361EE" stroke-width="0.7">
    <rect x="170" y="118" width="20" height="104" fill="#03001C"/>
    <line x1="170" y1="136" x2="190" y2="136"/>
    <line x1="170" y1="155" x2="190" y2="155"/>
    <line x1="170" y1="174" x2="190" y2="174"/>
    <line x1="170" y1="193" x2="190" y2="193"/>
    <line x1="180" y1="118" x2="180" y2="222"/>
  </g>
  <!-- L5 — tiny -->
  <g class="bld-r" fill="none" stroke="#F72585" stroke-width="0.6">
    <rect x="200" y="145" width="14" height="77" fill="#03001C"/>
    <line x1="200" y1="160" x2="214" y2="160"/>
    <line x1="200" y1="178" x2="214" y2="178"/>
    <line x1="200" y1="196" x2="214" y2="196"/>
    <line x1="207" y1="145" x2="207" y2="222"/>
  </g>

  <!-- ── RIGHT BUILDINGS (mirrored) ──────────────────────────── -->
  <!-- R5 -->
  <g class="bld-r" fill="none" stroke="#F72585" stroke-width="0.6">
    <rect x="686" y="145" width="14" height="77" fill="#03001C"/>
    <line x1="686" y1="160" x2="700" y2="160"/>
    <line x1="686" y1="178" x2="700" y2="178"/>
    <line x1="686" y1="196" x2="700" y2="196"/>
    <line x1="693" y1="145" x2="693" y2="222"/>
  </g>
  <!-- R4 -->
  <g class="bld-m" fill="none" stroke="#4361EE" stroke-width="0.7">
    <rect x="710" y="118" width="20" height="104" fill="#03001C"/>
    <line x1="710" y1="136" x2="730" y2="136"/>
    <line x1="710" y1="155" x2="730" y2="155"/>
    <line x1="710" y1="174" x2="730" y2="174"/>
    <line x1="710" y1="193" x2="730" y2="193"/>
    <line x1="720" y1="118" x2="720" y2="222"/>
  </g>
  <!-- R3 -->
  <g class="bld-l" fill="none" stroke="#4CC9F0" stroke-width="0.8">
    <rect x="740" y="72" width="48" height="150" fill="#03001C"/>
    <line x1="740" y1="92"  x2="788" y2="92"/>
    <line x1="740" y1="113" x2="788" y2="113"/>
    <line x1="740" y1="134" x2="788" y2="134"/>
    <line x1="740" y1="155" x2="788" y2="155"/>
    <line x1="740" y1="176" x2="788" y2="176"/>
    <line x1="740" y1="197" x2="788" y2="197"/>
    <line x1="764" y1="72"  x2="764" y2="222"/>
    <rect x="752" y="64" width="24" height="9" fill="#03001C" stroke="#4CC9F0" stroke-width="0.8"/>
    <line x1="764" y1="64" x2="764" y2="50"/>
  </g>
  <!-- R2 -->
  <g class="bld-m" fill="none" stroke="#7209B7" stroke-width="0.7">
    <rect x="798" y="95" width="26" height="127" fill="#03001C"/>
    <line x1="798" y1="114" x2="824" y2="114"/>
    <line x1="798" y1="134" x2="824" y2="134"/>
    <line x1="798" y1="154" x2="824" y2="154"/>
    <line x1="798" y1="174" x2="824" y2="174"/>
    <line x1="798" y1="194" x2="824" y2="194"/>
    <line x1="811" y1="95"  x2="811" y2="222"/>
  </g>
  <!-- R1 — tall tower -->
  <g class="bld-l" fill="none" stroke="#4CC9F0" stroke-width="0.8">
    <rect x="834" y="50" width="36" height="172" fill="#03001C"/>
    <line x1="834" y1="72"  x2="870" y2="72"/>
    <line x1="834" y1="95"  x2="870" y2="95"/>
    <line x1="834" y1="118" x2="870" y2="118"/>
    <line x1="834" y1="141" x2="870" y2="141"/>
    <line x1="834" y1="164" x2="870" y2="164"/>
    <line x1="834" y1="187" x2="870" y2="187"/>
    <line x1="852" y1="50"  x2="852" y2="222"/>
    <line x1="852" y1="50"  x2="852" y2="32"/>
    <line x1="844" y1="40"  x2="860" y2="40"/>
    <rect x="842" y="44" width="20" height="7" fill="#03001C"/>
  </g>

  <!-- ── FLOOR GRID ────────────────────────────────────────────── -->
  <rect x="0" y="222" width="900" height="58" fill="url(#grid-fade)"/>
  <g stroke="url(#grid-fade)" stroke-width="0.85" fill="none">
    <line x1="0" y1="238" x2="900" y2="238"/>
    <line x1="0" y1="252" x2="900" y2="252"/>
    <line x1="0" y1="266" x2="900" y2="266"/>
    <line x1="450" y1="222" x2="0"   y2="280"/>
    <line x1="450" y1="222" x2="100" y2="280"/>
    <line x1="450" y1="222" x2="200" y2="280"/>
    <line x1="450" y1="222" x2="300" y2="280"/>
    <line x1="450" y1="222" x2="400" y2="280"/>
    <line x1="450" y1="222" x2="450" y2="280"/>
    <line x1="450" y1="222" x2="500" y2="280"/>
    <line x1="450" y1="222" x2="600" y2="280"/>
    <line x1="450" y1="222" x2="700" y2="280"/>
    <line x1="450" y1="222" x2="800" y2="280"/>
    <line x1="450" y1="222" x2="900" y2="280"/>
  </g>

  <!-- Holographic horizon -->
  <rect class="holo-ln" x="0" y="220" width="900" height="3" fill="url(#holo)"/>

  <!-- Glitch line effect (random horizontal displacement) -->
  <rect class="glitch-fx" x="0" y="130" width="900" height="4" fill="#4CC9F0" opacity="0.5"/>

  <!-- CRT scan line -->
  <rect class="scan" x="0" y="-40" width="900" height="40" fill="url(#scan-grad)"/>

  <!-- Corner brackets -->
  <g class="corner" fill="none" stroke="#4CC9F0" stroke-width="2.5">
    <polyline points="0,26 0,5 26,5"/>
    <polyline points="874,5 895,5 895,26"/>
  </g>
  <g class="corner" fill="none" stroke="#F72585" stroke-width="2.5">
    <polyline points="0,254 0,275 26,275"/>
    <polyline points="874,275 895,275 895,254"/>
  </g>

  <!-- Sparkles scattered -->
  <g class="sp-a" transform="translate(235,95)">
    <polygon points="0,-9 4.5,0 0,9 -4.5,0" fill="#4CC9F0"/>
    <polygon points="0,-4 2,0 0,4 -2,0"     fill="#fff" opacity="0.8"/>
  </g>
  <g class="sp-b" transform="translate(665,90)">
    <polygon points="0,-9 4.5,0 0,9 -4.5,0" fill="#F72585"/>
    <polygon points="0,-4 2,0 0,4 -2,0"     fill="#fff" opacity="0.8"/>
  </g>
  <g class="sp-c" transform="translate(450,38)">
    <polygon points="0,-11 5.5,0 0,11 -5.5,0" fill="#7209B7" opacity="0.95"/>
    <polygon points="0,-5 2.5,0 0,5 -2.5,0"   fill="#fff"    opacity="0.6"/>
  </g>
  <g class="sp-d" transform="translate(350,155)">
    <polygon points="0,-6 3,0 0,6 -3,0" fill="#4361EE" opacity="0.8"/>
  </g>
  <g class="sp-e" transform="translate(550,150)">
    <polygon points="0,-6 3,0 0,6 -3,0" fill="#4CC9F0" opacity="0.8"/>
  </g>
  <g class="sp-a" transform="translate(450,175)">
    <polygon points="0,-5 2.5,0 0,5 -2.5,0" fill="#F72585" opacity="0.6"/>
  </g>

  <!-- Micro corner labels -->
  <text x="10" y="18" font-family="Courier New,monospace" font-size="8"
        fill="#4CC9F0" opacity="0.4">// offensive.security</text>
  <text x="890" y="270" text-anchor="end" font-family="Courier New,monospace" font-size="8"
        fill="#F72585" opacity="0.4">// forever.online</text>
</svg>
