<svg width="100%" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#03001C"/>
      <stop offset="50%"  stop-color="#0d0530"/>
      <stop offset="100%" stop-color="#050520"/>
    </linearGradient>
    <linearGradient id="holo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#4CC9F0" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#7209B7" stop-opacity="1"/>
      <stop offset="50%"  stop-color="#F72585" stop-opacity="1"/>
      <stop offset="75%"  stop-color="#4361EE" stop-opacity="1"/>
      <stop offset="100%" stop-color="#4CC9F0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="grid-fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#4CC9F0" stop-opacity="0"/>
      <stop offset="100%" stop-color="#4CC9F0" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="scan-g" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#4CC9F0" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#4CC9F0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4CC9F0" stop-opacity="0"/>
    </linearGradient>
    <style>
      @keyframes gb  { 0%,100%{opacity:.55} 50%{opacity:1}   }
      @keyframes gb2 { 0%,100%{opacity:.4}  50%{opacity:.9}  }
      @keyframes gb3 { 0%,100%{opacity:.35} 50%{opacity:.75} }
      @keyframes sp  {
        0%  {opacity:.1; transform:scale(.5) rotate(0deg)}
        50% {opacity:1;  transform:scale(1.4) rotate(45deg)}
        100%{opacity:.1; transform:scale(.5) rotate(90deg)}
      }
      @keyframes co  { 0%,90%,92%,100%{opacity:1} 91%{opacity:.08} }
      @keyframes hl  { 0%,100%{opacity:.5} 50%{opacity:1} }
      .bl  { animation: gb  3.2s ease-in-out infinite }
      .bm  { animation: gb2 4.0s ease-in-out .6s infinite }
      .br  { animation: gb3 2.8s ease-in-out 1.2s infinite }
      .sa  { animation: sp  2.1s ease-in-out infinite }
      .sb  { animation: sp  2.7s ease-in-out .9s infinite }
      .sc  { animation: sp  1.9s ease-in-out 1.6s infinite }
      .sd  { animation: sp  3.3s ease-in-out .4s infinite }
      .se  { animation: sp  2.5s ease-in-out 1.1s infinite }
      .cr  { animation: co  8s linear infinite }
      .hl  { animation: hl  2.8s ease-in-out infinite }
    </style>
  </defs>

  <!-- BG -->
  <rect width="900" height="280" fill="url(#bg)"/>

  <!-- ── CIRCUIT TRACES ─────────────────────────────────────── -->
  <g fill="none" stroke="#4361EE" stroke-width="0.9" opacity="0.4">
    <polyline points="215,58 250,58 250,88 330,88"/>
    <polyline points="215,105 275,105 275,118 330,118"/>
    <polyline points="242,72 242,58"/>
    <polyline points="308,88 308,108 330,108"/>
    <!-- right -->
    <polyline points="685,58 650,58 650,88 570,88"/>
    <polyline points="685,105 625,105 625,118 570,118"/>
    <polyline points="658,72 658,58"/>
    <polyline points="592,88 592,108 570,108"/>
    <!-- top bridge -->
    <polyline points="340,48 370,48 370,35 530,35 530,48 560,48"/>
    <polyline points="400,35 400,24 500,24 500,35"/>
  </g>

  <!-- circuit nodes -->
  <g fill="#4361EE" opacity="0.7">
    <circle cx="250" cy="58" r="3"><animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="88" r="2.5"/>
    <circle cx="275" cy="105" r="3"><animate attributeName="opacity" values="0.4;1;0.4" dur="3s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="308" cy="88" r="2.5"/>
    <circle cx="650" cy="58" r="3"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="650" cy="88" r="2.5"/>
    <circle cx="625" cy="105" r="3"><animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="592" cy="88" r="2.5"/>
    <circle cx="400" cy="24" r="3" fill="#7209B7"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="24" r="3" fill="#7209B7"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.5s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="24" r="4" fill="#F72585"><animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- data packets (SMIL stroke-dashoffset) -->
  <line x1="215" y1="88" x2="330" y2="88" stroke="#4CC9F0" stroke-width="4" stroke-dasharray="8 115" opacity="0.8">
    <animate attributeName="stroke-dashoffset" from="123" to="0" dur="2.5s" repeatCount="indefinite"/>
  </line>
  <line x1="570" y1="88" x2="685" y2="88" stroke="#F72585" stroke-width="4" stroke-dasharray="8 115" opacity="0.8">
    <animate attributeName="stroke-dashoffset" from="123" to="0" dur="3s" begin="0.8s" repeatCount="indefinite"/>
  </line>
  <line x1="370" y1="35" x2="530" y2="35" stroke="#7209B7" stroke-width="3" stroke-dasharray="8 152" opacity="0.7">
    <animate attributeName="stroke-dashoffset" from="160" to="0" dur="4s" begin="1.2s" repeatCount="indefinite"/>
  </line>

  <!-- ── CODE FRAGMENTS ─────────────────────────────────────── -->
  <text x="258" y="70" font-family="Courier New,monospace" font-size="9" fill="#4CC9F0" opacity="0.4">0x4F3A1B
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="5s" repeatCount="indefinite"/>
  </text>
  <text x="588" y="70" font-family="Courier New,monospace" font-size="9" fill="#7209B7" opacity="0.4">ff:a3:22
    <animate attributeName="opacity" values="0.2;0.55;0.2" dur="7s" begin="1s" repeatCount="indefinite"/>
  </text>
  <text x="265" y="135" font-family="Courier New,monospace" font-size="9" fill="#4CC9F0" opacity="0.35">SYN_ACK
    <animate attributeName="opacity" values="0.15;0.5;0.15" dur="6s" begin="2s" repeatCount="indefinite"/>
  </text>
  <text x="578" y="132" font-family="Courier New,monospace" font-size="9" fill="#F72585" opacity="0.35">0xDEAD
    <animate attributeName="opacity" values="0.15;0.5;0.15" dur="8s" begin="3s" repeatCount="indefinite"/>
  </text>
  <text x="352" y="44" font-family="Courier New,monospace" font-size="8" fill="#F72585" opacity="0.4">EXPLOIT
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="5.5s" begin="0.5s" repeatCount="indefinite"/>
  </text>
  <text x="502" y="44" font-family="Courier New,monospace" font-size="8" fill="#4CC9F0" opacity="0.4">ROP_CHAIN
    <animate attributeName="opacity" values="0.2;0.55;0.2" dur="6.5s" begin="2.5s" repeatCount="indefinite"/>
  </text>

  <!-- ── CROSSHAIRS (SMIL rotate) ──────────────────────────── -->
  <!-- Left -->
  <circle cx="298" cy="87" r="18" fill="none" stroke="#4CC9F0" stroke-width="0.8" opacity="0.5"/>
  <circle cx="298" cy="87" r="9"  fill="none" stroke="#4CC9F0" stroke-width="0.8" opacity="0.4"/>
  <g opacity="0.5">
    <line x1="280" y1="87" x2="272" y2="87" stroke="#4CC9F0" stroke-width="0.8"/>
    <line x1="316" y1="87" x2="324" y2="87" stroke="#4CC9F0" stroke-width="0.8"/>
    <line x1="298" y1="69" x2="298" y2="61" stroke="#4CC9F0" stroke-width="0.8"/>
    <line x1="298" y1="105" x2="298" y2="113" stroke="#4CC9F0" stroke-width="0.8"/>
    <animateTransform attributeName="transform" type="rotate"
      from="0 298 87" to="90 298 87" dur="10s" repeatCount="indefinite"/>
  </g>
  <!-- Right -->
  <circle cx="602" cy="87" r="18" fill="none" stroke="#F72585" stroke-width="0.8" opacity="0.5"/>
  <circle cx="602" cy="87" r="9"  fill="none" stroke="#F72585" stroke-width="0.8" opacity="0.4"/>
  <g opacity="0.5">
    <line x1="584" y1="87" x2="576" y2="87" stroke="#F72585" stroke-width="0.8"/>
    <line x1="620" y1="87" x2="628" y2="87" stroke="#F72585" stroke-width="0.8"/>
    <line x1="602" y1="69" x2="602" y2="61" stroke="#F72585" stroke-width="0.8"/>
    <line x1="602" y1="105" x2="602" y2="113" stroke="#F72585" stroke-width="0.8"/>
    <animateTransform attributeName="transform" type="rotate"
      from="90 602 87" to="0 602 87" dur="12s" repeatCount="indefinite"/>
  </g>

  <!-- ── CENTER GLOBE ───────────────────────────────────────── -->
  <!-- outer glow ring -->
  <circle cx="450" cy="115" r="66" fill="none" stroke="#4CC9F0" stroke-width="0.5" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.35;0.1" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="r"       values="64;68;64"     dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- wireframe globe -->
  <g fill="none" stroke="#4CC9F0" stroke-width="0.8" opacity="0.45">
    <circle cx="450" cy="115" r="56"/>
    <ellipse cx="450" cy="115" rx="56" ry="20"/>
    <ellipse cx="450" cy="115" rx="56" ry="38"/>
    <ellipse cx="450" cy="115" rx="28" ry="56"/>
    <ellipse cx="450" cy="115" rx="14" ry="56"/>
    <line x1="450" y1="59" x2="450" y2="171"/>
  </g>
  <!-- radar sweep (SMIL rotate) -->
  <line x1="450" y1="115" x2="506" y2="115"
        stroke="#4CC9F0" stroke-width="2.5" opacity="0.85">
    <animateTransform attributeName="transform" type="rotate"
      from="0 450 115" to="360 450 115" dur="5s" repeatCount="indefinite"/>
  </line>
  <!-- center dot -->
  <circle cx="450" cy="115" r="3.5" fill="#4CC9F0" opacity="0.9">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- ── BUILDINGS LEFT ─────────────────────────────────────── -->
  <g class="bl" fill="none" stroke="#4CC9F0" stroke-width="0.85">
    <rect x="30"  y="50" width="36" height="172" fill="#03001C"/>
    <line x1="30"  y1="72"  x2="66"  y2="72"/>
    <line x1="30"  y1="95"  x2="66"  y2="95"/>
    <line x1="30"  y1="118" x2="66"  y2="118"/>
    <line x1="30"  y1="141" x2="66"  y2="141"/>
    <line x1="30"  y1="164" x2="66"  y2="164"/>
    <line x1="30"  y1="187" x2="66"  y2="187"/>
    <line x1="48"  y1="50"  x2="48"  y2="222"/>
    <line x1="48"  y1="50"  x2="48"  y2="30"/>
    <line x1="40"  y1="38"  x2="56"  y2="38"/>
    <rect x="38"  y="43" width="20" height="8" fill="#03001C"/>
  </g>
  <g class="bm" fill="none" stroke="#7209B7" stroke-width="0.75">
    <rect x="76"  y="95" width="26" height="127" fill="#03001C"/>
    <line x1="76"  y1="114" x2="102" y2="114"/>
    <line x1="76"  y1="134" x2="102" y2="134"/>
    <line x1="76"  y1="154" x2="102" y2="154"/>
    <line x1="76"  y1="174" x2="102" y2="174"/>
    <line x1="76"  y1="194" x2="102" y2="194"/>
    <line x1="89"  y1="95"  x2="89"  y2="222"/>
  </g>
  <g class="bl" fill="none" stroke="#4CC9F0" stroke-width="0.85">
    <rect x="112" y="72" width="48" height="150" fill="#03001C"/>
    <line x1="112" y1="92"  x2="160" y2="92"/>
    <line x1="112" y1="113" x2="160" y2="113"/>
    <line x1="112" y1="134" x2="160" y2="134"/>
    <line x1="112" y1="155" x2="160" y2="155"/>
    <line x1="112" y1="176" x2="160" y2="176"/>
    <line x1="112" y1="197" x2="160" y2="197"/>
    <line x1="136" y1="72"  x2="136" y2="222"/>
    <rect x="124" y="63" width="24" height="10" fill="#03001C" stroke="#4CC9F0"/>
    <line x1="136" y1="63"  x2="136" y2="48"/>
  </g>
  <g class="bm" fill="none" stroke="#4361EE" stroke-width="0.75">
    <rect x="170" y="118" width="20" height="104" fill="#03001C"/>
    <line x1="170" y1="136" x2="190" y2="136"/>
    <line x1="170" y1="155" x2="190" y2="155"/>
    <line x1="170" y1="174" x2="190" y2="174"/>
    <line x1="170" y1="193" x2="190" y2="193"/>
    <line x1="180" y1="118" x2="180" y2="222"/>
  </g>
  <g class="br" fill="none" stroke="#F72585" stroke-width="0.65">
    <rect x="200" y="148" width="14" height="74" fill="#03001C"/>
    <line x1="200" y1="163" x2="214" y2="163"/>
    <line x1="200" y1="180" x2="214" y2="180"/>
    <line x1="200" y1="197" x2="214" y2="197"/>
    <line x1="207" y1="148" x2="207" y2="222"/>
  </g>

  <!-- ── BUILDINGS RIGHT ────────────────────────────────────── -->
  <g class="br" fill="none" stroke="#F72585" stroke-width="0.65">
    <rect x="686" y="148" width="14" height="74" fill="#03001C"/>
    <line x1="686" y1="163" x2="700" y2="163"/>
    <line x1="686" y1="180" x2="700" y2="180"/>
    <line x1="686" y1="197" x2="700" y2="197"/>
    <line x1="693" y1="148" x2="693" y2="222"/>
  </g>
  <g class="bm" fill="none" stroke="#4361EE" stroke-width="0.75">
    <rect x="710" y="118" width="20" height="104" fill="#03001C"/>
    <line x1="710" y1="136" x2="730" y2="136"/>
    <line x1="710" y1="155" x2="730" y2="155"/>
    <line x1="710" y1="174" x2="730" y2="174"/>
    <line x1="710" y1="193" x2="730" y2="193"/>
    <line x1="720" y1="118" x2="720" y2="222"/>
  </g>
  <g class="bl" fill="none" stroke="#4CC9F0" stroke-width="0.85">
    <rect x="740" y="72" width="48" height="150" fill="#03001C"/>
    <line x1="740" y1="92"  x2="788" y2="92"/>
    <line x1="740" y1="113" x2="788" y2="113"/>
    <line x1="740" y1="134" x2="788" y2="134"/>
    <line x1="740" y1="155" x2="788" y2="155"/>
    <line x1="740" y1="176" x2="788" y2="176"/>
    <line x1="740" y1="197" x2="788" y2="197"/>
    <line x1="764" y1="72"  x2="764" y2="222"/>
    <rect x="752" y="63" width="24" height="10" fill="#03001C" stroke="#4CC9F0"/>
    <line x1="764" y1="63"  x2="764" y2="48"/>
  </g>
  <g class="bm" fill="none" stroke="#7209B7" stroke-width="0.75">
    <rect x="798" y="95" width="26" height="127" fill="#03001C"/>
    <line x1="798" y1="114" x2="824" y2="114"/>
    <line x1="798" y1="134" x2="824" y2="134"/>
    <line x1="798" y1="154" x2="824" y2="154"/>
    <line x1="798" y1="174" x2="824" y2="174"/>
    <line x1="798" y1="194" x2="824" y2="194"/>
    <line x1="811" y1="95"  x2="811" y2="222"/>
  </g>
  <g class="bl" fill="none" stroke="#4CC9F0" stroke-width="0.85">
    <rect x="834" y="50" width="36" height="172" fill="#03001C"/>
    <line x1="834" y1="72"  x2="870" y2="72"/>
    <line x1="834" y1="95"  x2="870" y2="95"/>
    <line x1="834" y1="118" x2="870" y2="118"/>
    <line x1="834" y1="141" x2="870" y2="141"/>
    <line x1="834" y1="164" x2="870" y2="164"/>
    <line x1="834" y1="187" x2="870" y2="187"/>
    <line x1="852" y1="50"  x2="852" y2="222"/>
    <line x1="852" y1="50"  x2="852" y2="30"/>
    <line x1="844" y1="38"  x2="860" y2="38"/>
    <rect x="842" y="43" width="20" height="8" fill="#03001C"/>
  </g>

  <!-- ── FLOOR GRID ──────────────────────────────────────────── -->
  <rect x="0" y="222" width="900" height="58" fill="url(#grid-fade)"/>
  <g stroke="url(#grid-fade)" stroke-width="0.9" fill="none">
    <line x1="0" y1="238" x2="900" y2="238"/>
    <line x1="0" y1="252" x2="900" y2="252"/>
    <line x1="0" y1="266" x2="900" y2="266"/>
    <line x1="450" y1="222" x2="0"   y2="280"/>
    <line x1="450" y1="222" x2="100" y2="280"/>
    <line x1="450" y1="222" x2="200" y2="280"/>
    <line x1="450" y1="222" x2="300" y2="280"/>
    <line x1="450" y1="222" x2="400" y2="280"/>
    <line x1="450" y1="222" x2="450" y2="280"/>
    <line x1="450" y1="222" x2="500" y2="280"/>
    <line x1="450" y1="222" x2="600" y2="280"/>
    <line x1="450" y1="222" x2="700" y2="280"/>
    <line x1="450" y1="222" x2="800" y2="280"/>
    <line x1="450" y1="222" x2="900" y2="280"/>
  </g>

  <!-- holographic horizon -->
  <rect x="0" y="220" width="900" height="3" fill="url(#holo)" opacity="0.8">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.8s" repeatCount="indefinite"/>
  </rect>

  <!-- CRT scan line (SMIL translate) -->
  <rect x="0" y="0" width="900" height="40" fill="url(#scan-g)" opacity="0.9">
    <animateTransform attributeName="transform" type="translate"
      from="0,-42" to="0,292" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- glitch line -->
  <rect x="0" y="128" width="900" height="3" fill="#4CC9F0" opacity="0">
    <animate attributeName="opacity" values="0;0;0;0.6;0.3;0;0;0;0;0"
             dur="7s" repeatCount="indefinite"/>
    <animate attributeName="x" values="0;-8;6;0;0;0;0;0;0;0"
             dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- corner brackets -->
  <g class="cr" fill="none" stroke="#4CC9F0" stroke-width="2.5">
    <polyline points="0,26 0,5 26,5"/>
    <polyline points="874,5 895,5 895,26"/>
  </g>
  <g class="cr" fill="none" stroke="#F72585" stroke-width="2.5">
    <polyline points="0,254 0,275 26,275"/>
    <polyline points="874,275 895,275 895,254"/>
  </g>

  <!-- sparkles -->
  <g class="sa" transform="translate(237,152)">
    <polygon points="0,-9 4.5,0 0,9 -4.5,0" fill="#4CC9F0"/>
    <polygon points="0,-4 2,0 0,4 -2,0"     fill="#fff" opacity="0.8"/>
  </g>
  <g class="sb" transform="translate(663,150)">
    <polygon points="0,-9 4.5,0 0,9 -4.5,0" fill="#F72585"/>
    <polygon points="0,-4 2,0 0,4 -2,0"     fill="#fff" opacity="0.8"/>
  </g>
  <g class="sc" transform="translate(450,178)">
    <polygon points="0,-8 4,0 0,8 -4,0" fill="#7209B7" opacity="0.95"/>
  </g>
  <g class="sd" transform="translate(370,197)">
    <polygon points="0,-6 3,0 0,6 -3,0" fill="#4361EE" opacity="0.8"/>
  </g>
  <g class="se" transform="translate(530,195)">
    <polygon points="0,-6 3,0 0,6 -3,0" fill="#4CC9F0" opacity="0.8"/>
  </g>

  <!-- micro labels -->
  <text x="10" y="18" font-family="Courier New,monospace" font-size="8"
        fill="#4CC9F0" opacity="0.45">// offensive.security</text>
  <text x="890" y="270" text-anchor="end" font-family="Courier New,monospace" font-size="8"
        fill="#F72585" opacity="0.45">// forever.online</text>
</svg>
